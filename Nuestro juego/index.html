<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NUESTRO JUEGO DE PREGUNTITAS💕</title>

  <!-- Conectar CSS -->
  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="app">

    <!-- =========================================
         INICIO
         ========================================= -->

    <section id="home">

      <header class="header">

        <div class="logo">
          💕 NUESTRO JUEGO DE PREGUNTITAS
        </div>

        <p>
          Un juego de preguntas para conectar,
          descubrir y divertirse juntos, creado por el hombre que mas te ama, Nico.
        </p>

      </header>


      <h1>
        ¿Qué quieren descubrir?
      </h1>


      <div class="categories">


        <!-- AFECTO -->

        <button
          class="category"
          onclick="startGame('afecto')"
        >

          <span class="icon">
            💕
          </span>

          <span class="category-name">
            Afecto
          </span>

          <span class="description">
            Cariño y conexión
          </span>

        </button>


        <!-- VALORES -->

        <button
          class="category"
          onclick="startGame('valores')"
        >

          <span class="icon">
            🧭
          </span>

          <span class="category-name">
            Creencias y valores
          </span>

          <span class="description">
            Lo que piensan, creen y valoran
          </span>

        </button>


        <!-- FAMILIA -->

        <button
          class="category"
          onclick="startGame('familia')"
        >

          <span class="icon">
            🏠
          </span>

          <span class="category-name">
            Familia y hogar
          </span>

          <span class="description">
            Familia, convivencia y futuro
          </span>

        </button>


        <!-- INTERESES -->

        <button
          class="category"
          onclick="startGame('intereses')"
        >

          <span class="icon">
            🎵
          </span>

          <span class="category-name">
            Intereses y favoritos
          </span>

          <span class="description">
            Música, películas, gustos y hobbies
          </span>

        </button>


        <!-- PERSONALIDAD -->

        <button
          class="category"
          onclick="startGame('personalidad')"
        >

          <span class="icon">
            🧠
          </span>

          <span class="category-name">
            Personalidad y hábitos
          </span>

          <span class="description">
            Descubre cómo funciona la otra persona
          </span>

        </button>


        <!-- TRABAJO -->

        <button
          class="category"
          onclick="startGame('trabajo')"
        >

          <span class="icon">
            💼
          </span>

          <span class="category-name">
            Trabajo y dinero
          </span>

          <span class="description">
            Metas, trabajo y futuro financiero
          </span>

        </button>

      </div>

    </section>


    <!-- =========================================
         JUEGO
         ========================================= -->

    <section id="game">


      <button
        class="back-button"
        onclick="goHome()"
      >

        ← Categorías

      </button>


      <header class="game-header">

        <span id="categoryIcon">
          💕
        </span>

        <h2 id="categoryTitle">
          Afecto y preguntas HOT
        </h2>

      </header>


      <div class="card-container">

        <div class="question-card">

          <div class="card-label">
            ENTRE NOSOTROS
          </div>

          <div id="question">
            Cargando pregunta...
          </div>

        </div>

      </div>


      <div class="game-controls">

        <button
          class="next-button"
          onclick="nextQuestion()"
        >

          🎲 Siguiente pregunta

        </button>

      </div>


      <div
        id="counter"
        class="counter"
      >

        Pregunta 1 de 50

      </div>


    </section>

  </main>


  <!-- =========================================
       CONECTAR JAVASCRIPT
       ========================================= -->

  <script src="script.js"></script>

</body>

</html>
